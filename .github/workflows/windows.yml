name: Build Windows & release updates
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Preparar catálogo de jogos e DLCs
        run: python scripts/restore_catalog.py
      - name: Testar
        run: go test ./...
      - name: Compilar exe com feed e chave pública
        shell: pwsh
        env:
          UPDATE_FEED_URL: ${{ vars.UPDATE_FEED_URL }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          $version = '2.2.0'
          if ('${{ github.ref_type }}' -eq 'tag') { $version = '${{ github.ref_name }}'.TrimStart('v') }
          $ldflags = "-H=windowsgui -s -w -X main.appVersion=$version"
          if ($env:UPDATE_FEED_URL -and $env:UPDATE_PUBLIC_KEY) {
            $ldflags += " -X main.updateFeedURL=$env:UPDATE_FEED_URL -X main.updatePublicKey=$env:UPDATE_PUBLIC_KEY"
          }
          go build -trimpath -ldflags $ldflags -o Astronyx-Steam-Manager.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: Astronyx-Steam-Manager-Windows
          path: Astronyx-Steam-Manager.exe
          if-no-files-found: error
      - name: Consolidar catálogo original no repositório
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          if (-not (Test-Path 'assets/.chunks')) { exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f assets/GameList-main.zip
          git rm -r assets/.chunks
          git commit -m 'data: restaurar GameList original [skip ci]'
          git push origin HEAD:main
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: Astronyx-Steam-Manager-Windows
          path: release
      - name: Verificar configuração e assinar metadados
        env:
          ASTRONYX_UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
          PUBLIC_BASE_URL: ${{ vars.UPDATE_PUBLIC_BASE_URL }}
          FEED_URL: ${{ vars.UPDATE_FEED_URL }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        shell: bash
        run: |
          set -euo pipefail
          for name in ASTRONYX_UPDATE_PRIVATE_KEY PUBLIC_BASE_URL FEED_URL UPDATE_PUBLIC_KEY R2_ENDPOINT R2_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [[ -z "${!name:-}" ]]; then echo "Configuração ausente: $name" >&2; exit 1; fi
          done
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET_URL="${PUBLIC_BASE_URL%/}/releases/v${VERSION}/Astronyx-Steam-Manager.exe"
          go run ./tools/sign-release --version "$VERSION" --url "$ASSET_URL" --file release/Astronyx-Steam-Manager.exe --notes "Versão estável $VERSION do Astronyx Steam Manager" > release/latest.json
          aws --endpoint-url "$R2_ENDPOINT" s3 cp release/Astronyx-Steam-Manager.exe "s3://$R2_BUCKET/releases/v$VERSION/Astronyx-Steam-Manager.exe" --content-type application/octet-stream --no-progress
          # Write the signed feed last, after the executable is fully available.
          aws --endpoint-url "$R2_ENDPOINT" s3 cp release/latest.json "s3://$R2_BUCKET/releases/latest.json" --content-type application/json --cache-control 'no-store, max-age=0' --no-progress
          echo "Versão v$VERSION publicada no R2; feed: $FEED_URL"
